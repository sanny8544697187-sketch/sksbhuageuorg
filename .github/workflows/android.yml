name: Android CI - Build Signed AAB v9

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Fix keystore path in build.gradle
      run: |
        KEYSTORE_ABS="${{ github.workspace }}/signing.keystore"
        sed -i "s|storeFile file('../../signing.keystore')|storeFile file('${KEYSTORE_ABS}')|g" app/build.gradle
        echo "Keystore path set to: $KEYSTORE_ABS"
        grep "storeFile" app/build.gradle

    - name: Build Release AAB
      run: ./gradlew bundleRelease
      env:
        JAVA_TOOL_OPTIONS: "-Xmx4g"

    - name: Verify and copy signed AAB
      run: |
        INPUT_AAB="${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab"
        OUTPUT_AAB="${{ github.workspace }}/KrishiGyan-v9-signed.aab"
        ls -la "$INPUT_AAB"
        cp "$INPUT_AAB" "$OUTPUT_AAB"
        echo "AAB ready at $OUTPUT_AAB"

    - name: Upload Signed AAB v9
      uses: actions/upload-artifact@v4
      with:
        name: KrishiGyan-v9-signed-aab
        path: KrishiGyan-v9-signed.aab
        retention-days: 30
